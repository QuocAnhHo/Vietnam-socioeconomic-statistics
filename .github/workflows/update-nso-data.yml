name: Check NSO monthly data

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-nso-data.yml'
      - 'scripts/update_monthly_data.py'
      - 'scripts/requirements-monthly-update.txt'
  schedule:
    - cron: '23 5 * * *'
      timezone: 'Asia/Ho_Chi_Minh'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: nso-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-monthly-update.txt
      - name: Install spreadsheet readers
        run: python -m pip install -r scripts/requirements-monthly-update.txt
      - name: Discover NSO releases and convert new spreadsheets to CSV
        id: refresh
        run: python scripts/update_monthly_data.py
      - name: Set up pnpm
        if: steps.refresh.outputs.changed == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Set up Node.js
        if: steps.refresh.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Build the website
        if: steps.refresh.outputs.changed == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Commit data changes and publish
        if: steps.refresh.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/webdata/publications.json public/webdata/release-catalogue.json public/webdata/release-details public/downloads/releases data/release_csv docs
          if git diff --cached --quiet; then
            echo 'No data or website changes to publish.'
            exit 0
          fi
          git commit -m 'Refresh NSO monthly report and CPI data'
          git push origin HEAD:main
      - name: Request GitHub Pages build
        if: steps.refresh.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds"
